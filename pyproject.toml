[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bayesab"
version = "0.1.0"
description = "From-scratch Bayesian A/B testing toolkit: Beta-Binomial conjugate posteriors, credible intervals, probability-to-beat-control, and expected-loss stopping rules."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Arnav Chawla" }]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pyflakes>=3.1",
]

[project.scripts]
bayesab = "bayesab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
